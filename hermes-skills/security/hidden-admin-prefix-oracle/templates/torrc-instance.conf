# Tor client instance — copy per instance (ports iN: Socks = base, Control = base+1)
SocksPort 127.0.0.1:9060
ControlPort 127.0.0.1:9061
DataDirectory /var/lib/tor-inst2
RunAsDaemon 1
ClientOnly 1

# Raise the concurrent-circuit ceiling; default 32 throttles large worker fleets
MaxClientCircuitsPending 512

# Keep circuits long enough to amortise build cost, but rotate on pressure
MaxCircuitDirtiness 120
NewCircuitPeriod 45

# Fixed build timeout (learning it on a loaded box makes latency erratic)
CircuitBuildTimeout 20
LearnCircuitBuildTimeout 0

# Fewer guards = fewer distinct entry paths to keep warm
NumEntryGuards 3

# Logs must be writable by the tor user
Log notice file /var/log/tor/inst2.log
