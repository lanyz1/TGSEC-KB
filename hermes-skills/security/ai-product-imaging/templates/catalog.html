<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品图册</title>
<style>
/* ============================================================
   A4 产品画册  ——  封面 + 一页一品 + 末尾价目总表
   用法:改下面 <script> 里的 BRAND 和 PRODUCTS 即可
   出片:浏览器打开 → Ctrl+P → 目标"另存为PDF" → 边距"无" → 背景图形"开"
   适配:生成图放 images/ 子目录, PRODUCTS.img 填 "images/NN_sku.png"
   币种:价格条默认 USDT;改 ¥ 把 .cur 文字换成 ¥
   2026-08-13 定稿: 价格条只留批发价大字(右下角运费块用户已拍板删);
   SKU 明细一行一个(≤16 色) / 17-28 两列 / >28 三列; figure 68mm 防 43 色爆页
   ============================================================ */
:root{
  --accent:#c0392b;      /* 品牌强调色,想换色改这一处 */
  --ink:#1a1a1a;
  --sub:#6b6b6b;
  --line:#e6e6e6;
  --bg-soft:#f7f7f8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  color:var(--ink);background:#d9dadd;
}

/* 每一页 = 一张 A4 */
.page{
  width:210mm;height:297mm;
  background:#fff;margin:12px auto;position:relative;overflow:hidden;
  box-shadow:0 6px 24px rgba(0,0,0,.15);
}
@media print{
  body{background:#fff}
  .page{margin:0;box-shadow:none;page-break-after:always}
  .page:last-child{page-break-after:auto}
}

/* ---------------- 封面 ---------------- */
.cover{display:flex;flex-direction:column;color:#fff;
  background:linear-gradient(160deg,#1f2a36 0%,#2c3e50 55%,#34495e 100%);}
.cover .top{flex:none;padding:22mm 20mm 0}
.cover .brand{font-size:20px;letter-spacing:2px;opacity:.85}
.cover .hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20mm}
.cover .hero h1{font-size:52px;font-weight:800;line-height:1.15;letter-spacing:1px}
.cover .hero .en{font-size:18px;letter-spacing:6px;opacity:.6;margin-top:10px;text-transform:uppercase}
.cover .hero .line{width:70px;height:5px;background:var(--accent);margin:26px 0}
.cover .hero .desc{font-size:15px;line-height:1.9;opacity:.8;max-width:120mm}
.cover .foot{flex:none;padding:0 20mm 22mm;font-size:13px;opacity:.75;line-height:1.9}
.cover .foot b{color:#fff;opacity:1}

/* ---------------- 一页一品 详情 ---------------- */
.detail{display:flex;flex-direction:column;padding:16mm 18mm}
.detail .head{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:0}
.detail .head .cat{font-size:12px;letter-spacing:2px;color:var(--sub)}
.detail .head .pg{font-size:12px;color:var(--sub)}
.detail .figure{flex:none;height:68mm;margin:6mm 0;background:var(--bg-soft);
  border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.detail .figure img{width:100%;height:100%;object-fit:contain}
.detail .figure .ph{color:#b9bcc2;font-size:15px;text-align:center;line-height:2}
.detail .body{flex:1}
.detail .model{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:1px}
.detail h2{font-size:30px;font-weight:800;margin:4px 0 6px}
.detail .slogan{font-size:15px;color:var(--sub);margin-bottom:20px}
.detail .specs{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-bottom:8px}
.detail .specs .row{display:flex;justify-content:space-between;
  border-bottom:1px dashed var(--line);padding:5px 0;font-size:13px}
.detail .specs .row .k{color:var(--sub)}
.detail .specs .row .v{font-weight:600}
/* SKU 明细: 一行一个; cols2/cols3 由 JS 按数量加(>16 两列, >28 三列) */
.detail .skus{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.detail .skus-title{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:1px;margin-bottom:8px}
.detail .skus-rows{display:grid;grid-template-columns:1fr;gap:0}
.detail .skus-rows.cols2{grid-template-columns:1fr 1fr;column-gap:26px}
.detail .skus-rows.cols3{grid-template-columns:1fr 1fr 1fr;column-gap:20px}
.detail .sku-row{display:flex;align-items:center;gap:8px;padding:3px 2px;border-bottom:1px dashed var(--line);font-size:11.5px;white-space:nowrap}
.detail .sku-row:last-child{border-bottom:none}
.detail .sku-row .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.55;flex:none}
.detail .sku-row .v{font-weight:600;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail .sku-row .code{color:#9a9fa8;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.detail .sku-row .p{color:var(--accent);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:82px;text-align:right}
/* 价格条: 只保留左边批发价大字(右下角运费/拿货价块用户 2026-08-13 拍板删除) */
.detail .pricebar{margin-top:auto;display:flex;align-items:flex-end;
  background:var(--bg-soft);border-radius:12px;padding:12px 20px}
.detail .pricebar .tag{font-size:13px;color:var(--sub)}
.detail .pricebar .price{font-size:40px;font-weight:800;color:var(--accent);line-height:1}
.detail .pricebar .price .cur{font-size:13px;margin-right:2px}

/* ---------------- 价目总表 ---------------- */
.pricelist{padding:16mm 16mm}
.pricelist h2{font-size:26px;font-weight:800;margin-bottom:4px}
.pricelist .sub{font-size:13px;color:var(--sub);margin-bottom:16px}
.pricelist table{width:100%;border-collapse:collapse;font-size:12.5px}
.pricelist thead th{background:#2c3e50;color:#fff;font-weight:600;
  padding:9px 10px;text-align:left}
.pricelist thead th.r{text-align:right}
.pricelist tbody td{padding:8px 10px;border-bottom:1px solid var(--line)}
.pricelist tbody tr:nth-child(even){background:var(--bg-soft)}
.pricelist tbody td.r{text-align:right;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.pricelist tbody td.model{font-weight:600}
.pricelist .note{margin-top:14px;font-size:12px;color:var(--sub);line-height:1.9}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   1) 品牌信息 —— 改这里
   ============================================================ */
const BRAND = {
  name:    "XX 三维科技",
  title:   "3D 打印机\n产品图册",
  en:      "Product Catalog",
  desc:    "覆盖入门到工业级的桌面 FDM / 光固化打印机全系列,面向教育、创客、模型手办、工业打样等场景,提供整机一年质保与终身技术支持。",
  year:    "2026",
  contact: [
    "联系电话:138-0000-0000",
    "邮箱:<EMAIL-REDACTED>",
    "地址:XX省XX市XX区XX路XX号",
    "官网:www.example.com",
  ],
};

/* ============================================================
   2) 产品列表 —— 一个 {} 就是一个产品,复制粘贴即可扩到 40+
      img: 填图片文件名(和本文件同目录或 images/ 子目录),留空 "" 显示占位框
      specs: 想加几条加几条
      skus: 多 SKU 明细数组(可选;>1 项才显示"SKU 明细"区块)
            label 只取第一段颜色名(防换行), price 为该 SKU 单价
   ============================================================ */
const PRODUCTS = [
  {
    model:"B0GQMN8VLS", name:"A1 Combo + LED Lamp Kit", cat:"3D 打印机 · 整机",
    slogan:"桌面级 3D 打印机,厂家直供",
    img:"images/01_B0GQMN8VLS.png", price:262,
    specs:{"品牌":"Bambu Lab","类型":"桌面 FDM 3D 打印机","系列":"A1","SKU":"B0GQMN8VLS","发货":"48 小时内发货"},
    skus:[{label:"标配套装", sku:"B0GQMN8VLS", price:"525.27"}],
  },
  // ↓↓↓ 复制上面任意一段,往下加到 40+ 个 ↓↓↓
];

/* ============================================================
   3) 渲染(下面不用改)
   ============================================================ */
const money = n => n.toLocaleString("zh-CN");
const app = document.getElementById("app");
let html = "";

// 封面
html += `
<section class="page cover">
  <div class="top"><div class="brand">${BRAND.name}</div></div>
  <div class="hero">
    <div class="line"></div>
    <h1>${BRAND.title.replace(/\n/g,"<br>")}</h1>
    <div class="en">${BRAND.en} · ${BRAND.year}</div>
    <p class="desc">${BRAND.desc}</p>
  </div>
  <div class="foot">${BRAND.contact.map(c=>`<div>${c}</div>`).join("")}</div>
</section>`;

// 一页一品
PRODUCTS.forEach((p, i) => {
  const specs = Object.entries(p.specs).map(([k,v])=>
    `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
  // 多 SKU 明细(单 SKU 商品不显示); ≤16 一行一个, 17-28 两列, >28 三列
  const skusBlock = p.skus && p.skus.length > 1
    ? `<div class="skus"><div class="skus-title">SKU 明细</div><div class="skus-rows${p.skus.length > 28 ? " cols3" : p.skus.length > 16 ? " cols2" : ""}">` +
      p.skus.map(s => `<div class="sku-row"><span class="dot"></span><span class="v">${s.label}</span><span class="code">${s.sku ?? ""}</span><span class="p">${s.price} USDT</span></div>`).join("") +
      `</div></div>`
    : "";
  const fig = p.img
    ? `<img src="${p.img}" alt="${p.model}">`
    : `<div class="ph">产品图占位<br>把图片放到本文件夹<br>并在 PRODUCTS 里填写 img 文件名</div>`;
  html += `
<section class="page detail">
  <div class="head"><span class="cat">${p.cat}</span><span class="pg">${String(i+1).padStart(2,"0")} / ${String(PRODUCTS.length).padStart(2,"0")}</span></div>
  <div class="figure">${fig}</div>
  <div class="body">
    <div class="model">${p.model}</div>
    <h2>${p.name}</h2>
    <div class="slogan">${p.slogan}</div>
    <div class="specs">${specs}</div>
    ${skusBlock}
  </div>
  <div class="pricebar">
    <div><div class="tag">批发价</div><div class="price"><span class="cur">USDT</span>${money(p.price)}</div></div>
  </div>
</section>`;
});

// 价目总表
const rows = PRODUCTS.map((p,i)=>`
  <tr>
    <td>${i+1}</td>
    <td class="model">${p.model}</td>
    <td>${p.name}</td>
    <td>${p.specs["材料"]||p.specs["系列"]||"—"}</td>
    <td class="r">USDT ${money(p.price)}</td>
  </tr>`).join("");
html += `
<section class="page pricelist">
  <h2>价目总表 Price List</h2>
  <div class="sub">${BRAND.name} · ${BRAND.year} · 价格以 USDT 计,最终以正式报价单为准</div>
  <table>
    <thead><tr><th>序号</th><th>型号</th><th>名称</th><th>材料/系列</th><th class="r">厂家拿货价(USDT)</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <div class="note">
    · 以上为厂家拿货参考价,含税不含运费;实际成交价以正式报价单为准。<br>
    · 运费:整机/套装 60 USDT,耗材/配件 8 USDT。<br>
    · 质保:整机一年,终身技术支持;交货期:下单后 5-7 个工作日。
  </div>
</section>`;

app.innerHTML = html;
</script>
</body>
</html>
